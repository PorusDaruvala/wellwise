l explanations, not quantified additive benefits. A shared goal does not prove a causal interaction.</p><button class="btn alt sm" onclick="nav('journey')">See my complete journey →</button></div><div class="panel spaced"><h3>Evidence and reference reading</h3><p class="small muted">${esc(t.evidenceScope)}. Tip-by-tip clinical review is not complete in this prototype.</p><div class="sourcelinks">${links(t)}</div></div>`}
function dailyTip(){let arr=TIPS.filter(eligible).filter(t=>!S.cats.length||S.cats.includes(t.category));if(!arr.length)arr=TIPS.filter(eligible);let seed=day()*17+31;return arr[(Math.abs(seed))%arr.length]}
function discover(){const t=dailyTip(),unseen=TIPS.filter(eligible).filter(x=>!S.seen[x.id]);return `${header('A little knowledge goes a long way','Discover something worthwhile.','Practical, evidence-informed insights sparked by everyday life—and a bigger picture once you explore them.')}<div class="hero spaced"><div class="eyebrow">Your daily insight · ${new Date().toLocaleDateString(undefined,{month:'short',day:'numeric'})}</div><h2 style="font-size:30px;margin-top:12px">${esc(t.title)}</h2><p class="lead">${esc(t.why)}</p><p><b>Try this:</b> ${esc(t.action)}</p><div class="row spaced"><button class="btn" onclick="nav('tip/${t.id}')">Explore today's tip →</button><button class="btn ghost" onclick="nav('agent')">See agent-driven discovery</button></div></div><div class="sectiontitle"><h2>Where discoveries begin</h2></div><div class="grid three">${['Commerce','Travel','Environment','Routine','Groceries','Activity'].map(k=>{let x=SCENARIOS.find(s=>s.kind===k);return `<div class="card"><span class="badge">${k}</span><h3 style="margin-top:12px">${esc(x.name)}</h3><p class="small muted">A familiar event could introduce an unexpected insight.</p><button class="btn alt sm" onclick="selectScenario('${x.id}');nav('agent')">Try this scenario →</button></div>`}).join('')}</div><div class="sectiontitle"><h2>Keep exploring</h2><button class="btn ghost sm" onclick="nav('explore')">Full library →</button></div><div class="grid">${(unseen.length?unseen:TIPS).slice(0,6).map(card).join('')}</div>`}
function match(s){return TIPS.filter(t=>t.triggerKeys.includes(s.event)).filter(t=>t.scope==='GLOBAL'||t.regions.includes(s.region)).map(t=>({t,score:100+(S.seen[t.id]?-23:0)+(S.cats.includes(t.category)?8:0)+(S.feedback[t.id]==='not-useful'?-40:0)+(S.statuses[t.id]==='not-relevant'?-50:0)})).sort((a,b)=>b.score-a.score||a.t.id.localeCompare(b.t.id))}
function deliver(){let sc=scenario(S.scenario),arr=match(sc);if(!arr.length){toast('No strong tip match: no notification sent');return}let t=arr[0].t;markSeen(t.id,S.agent);let entry={id:'evt-'+Date.now(),tip:t.id,agent:S.agent,scenario:sc.id,channel:S.channel,at:Date.now()};S.events.unshift(entry);S.events=S.events.slice(0,80);S.notifications.unshift({id:entry.id,tip:t.id,at:entry.at,message:`A Wellwise insight inspired by: ${sc.name}`,agent:S.agent,channel:S.channel});S.notifications=S.notifications.slice(0,80);persist();render();toast('Wellwise insight delivered in this demo')}
function selectScenario(id){S.scenario=id;persist()}
function changeAgent(v){S.agent=v;persist();render()}
function agent(){const sc=scenario(S.scenario),matches=match(sc),top=matches[0]?.t;return `${header('Agent discovery simulator','The agent finds the moment. Wellwise gives it meaning.','Simulate a personal AI agent encountering a real-world event, delivering an attributed insight and inviting further discovery.')}<div class="notice spaced"><b>Simulation:</b> No real agent, retailer, calendar or personal account is connected. All event data below is illustrative. The engine uses curated product/event keys and transparent ranking rules.</div><div class="sidebyside spaced"><div class="panel"><h2>1. Choose a context</h2><div class="formgrid"><label>Simulated personal agent<select class="field" id="agentChoice" onchange="changeAgent(this.value)">${['Muse (demo)','Instinct (demo)','Dots (demo)','Other personal agent (demo)'].map(x=>`<option ${S.agent===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Delivery channel<select class="field" id="channelChoice" onchange="S.channel=this.value;persist();render()">${['Agent','Email preview','Push preview'].map(x=>`<option ${S.channel===x?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="sectiontitle"><h3>Sample events</h3></div><div class="grid two">${SCENARIOS.map(s=>`<button class="scenario ${sc.id===s.id?'selected':''}" style="text-align:left" onclick="selectScenario('${s.id}');render()"><span class="badge">${esc(s.kind)}</span><div style="margin-top:8px"><b>${esc(s.name)}</b></div></button>`).join('')}</div></div><div class="panel"><h2>2. Preview the discovery</h2><div class="agentbubble"><div class="eyebrow">${esc(S.agent)}</div><p class="small muted">${esc(sc.detail)}</p>${top?`<div class="card"><div class="row between"><b>well<span style="color:var(--green)">wise.</span></b><span class="badge">Attributed insight</span></div><h3 class="spaced">${esc(top.title)}</h3><p>${esc(top.why)}</p><p class="small"><b>Try:</b> ${esc(top.action)}</p><button class="btn alt sm" onclick="deliver();nav('tip/${top.id}')">Explore on Wellwise →</button></div>`:`<div class="notice warning"><b>No strong contextual match.</b><p>The matching engine will not invent a wellness link for this event.</p></div>`}</div><div class="row spaced"><button class="btn" ${!top?'disabled':''} onclick="deliver()">Deliver attributed insight</button><button class="btn ghost" onclick="nav('journey')">View shared journey</button></div><div class="spaced"><h3>How the match was selected</h3><p class="small muted">Exact curated event-key match; correct geographic eligibility; editorial preference and novelty adjustment. There is no external AI inference or medical-history filtering.</p>${matches.slice(0,4).map((m,i)=>`<div class="row between" style="padding:9px;border-bottom:1px solid var(--line)"><span class="small">${i+1}. ${esc(m.t.title)}</span><span class="badge numeric">${m.score} relevance</span></div>`).join('')||'<p class="muted">No candidate tips.</p>'}</div></div></div><div class="sectiontitle"><h2>3. Cross-agent continuity</h2></div><div class="panel">${S.events.length?`<div class="timeline">${S.events.slice(0,8).map(e=>`<div class="event"><b>${esc(e.agent)}</b> <span class="muted small">· ${new Date(e.at).toLocaleString()}</span><p><a href="#tip/${e.tip}">${esc(tip(e.tip)?.title)}</a></p><p class="small muted">${esc(scenario(e.scenario)?.name)} · ${esc(e.channel)}</p></div>`).join('')}</div>`:'<div class="empty">Deliver a tip through one agent, switch to another and deliver again. Both appear in this shared timeline.</div>'}</div>`}
function journey(){const seen=TIPS.filter(t=>S.seen[t.id]),adopted=TIPS.filter(t=>stat(t.id)==='adopted'),trying=TIPS.filter(t=>stat(t.id)==='trying'),ids=new Set([...seen.map(t=>t.id),...adopted.map(t=>t.id)]),jEdges=EDGES.filter(e=>ids.has(e.a)||ids.has(e.b)),agents=[...new Set(S.events.map(e=>e.agent))];return `${header('Your connected knowledge','My journey','Your discoveries stay with Wellwise, even when the introducing agent changes. This is a learning and behavior record, not a measured health score.')}<div class="grid spaced">${[['Discovered',seen.length],['Trying',trying.length],['Adopted',adopted.length]].map(([x,n])=>`<div class="card"><div class="eyebrow">${x}</div><div class="metric numeric spaced">${n}</div><p class="small muted">${x==='Discovered'?'Insights you have opened or received':x==='Trying'?'Actions you chose to try':'Actions you reported already doing'}</p></div>`).join('')}</div><div class="sidebyside spaced"><div class="panel"><h2>Your discovery timeline</h2>${seen.length?`<div class="timeline">${seen.slice().sort((a,b)=>S.seen[b.id]-S.seen[a.id]).slice(0,25).map(t=>`<div class="event"><a href="#tip/${t.id}"><b>${esc(t.title)}</b></a><p class="small muted">${esc(S.source[t.id]||'Wellwise')} · ${new Date(S.seen[t.id]).toLocaleDateString()} · ${esc(statusLabel(stat(t.id))||'Discovered')}</p></div>`).join('')}</div>`:'<div class="empty">Start with a discovery from your daily feed or the agent simulator.</div>'}</div><div class="panel"><h2>How your discoveries connect</h2>${jEdges.length?`<p class="muted small">${jEdges.length} editorial relationships touch an insight in your journey.</p>${jEdges.slice(0,12).map(e=>`<div class="graphnode" style="margin-bottom:9px"><span class="badge">${esc(e.type)}</span><p><a href="#tip/${e.a}">${esc(tip(e.a).title)}</a> ↔ <a href="#tip/${e.b}">${esc(tip(e.b).title)}</a></p><p class="small muted">${esc(e.why)}</p></div>`).join('')}`:'<div class="empty">Explore related tips to reveal evidence-described relationships.</div>'}<p class="small muted">These are knowledge links, not proof of combined clinical benefit.</p></div></div><div class="panel spaced"><h2>One journey across agents</h2><p>${agents.length?agents.map(a=>`<span class="badge" style="margin-right:6px">${esc(a)}</span>`).join(''):'No agent-generated discoveries yet.'}</p><p class="small muted">Local browser storage is shared across the simulated agents. Cross-device synchronization would require an account and backend.</p></div><div class="sectiontitle"><h2>What you're trying</h2></div><div class="grid">${trying.length?trying.map(card).join(''):'<div class="empty">Mark a tip “I’ll try this” to see it here.</div>'}</div><div class="sectiontitle"><h2>Already doing</h2></div><div class="grid">${adopted.length?adopted.map(card).join(''):'<div class="empty">Mark an action “Already doing” when it is part of your routine.</div>'}</div>`}
function explore(){let a=TIPS.filter(eligible).filter(t=>!S.cats.length||S.cats.includes(t.category));if(searchCat!=='ALL')a=a.filter(t=>t.category===searchCat);if(searchScope==='LOCAL')a=a.filter(t=>t.scope!=='GLOBAL');if(searchText)a=a.filter(t=>[t.title,t.action,t.why,t.category,...t.tags,...t.triggerKeys].join(' ').toLowerCase().includes(searchText.toLowerCase()));return `${header('The health library','Explore 200 worthwhile insights.','Search by topic, activity, product or everyday situation. The complete original corpus is retained.')}<div class="panel spaced"><div class="grid three"><input class="field" id="search" placeholder="Search 200 tips…" aria-label="Search tips" value="${esc(searchText)}" oninput="searchText=this.value;updateExploreResults()"><select class="field" id="category" aria-label="Filter category" onchange="searchCat=this.value;render()"><option value="ALL">All categories</option>${CATS.map(c=>`<option value="${esc(c)}" ${searchCat===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select class="field" aria-label="Filter geographic scope" onchange="searchScope=this.value;render()"><option value="ALL">All applicable tips</option><option value="LOCAL" ${searchScope==='LOCAL'?'selected':''}>Geography-specific only</option></select></div><p class="small muted" id="exploreCount">Showing ${a.length} of 200 · Primary geography: ${esc(REGIONS[S.geo])}</p></div><div class="grid spaced" id="exploreResults">${a.length?a.map(card).join(''):'<div class="empty">No tips match. Try broader filters.</div>'}</div>`}
function updateExploreResults(){let a=TIPS.filter(eligible).filter(t=>!S.cats.length||S.cats.includes(t.category)).filter(t=>searchCat==='ALL'||t.category===searchCat).filter(t=>searchScope!=='LOCAL'||t.scope!=='GLOBAL').filter(t=>[t.title,t.action,t.why,t.category,...t.tags,...t.triggerKeys].join(' ').toLowerCase().includes(searchText.toLowerCase()));$('exploreResults').innerHTML=a.length?a.map(card).join(''):'<div class="empty">No matches.</div>';$('exploreCount').textContent=`Showing ${a.length} of 200`}
function notifications(){return `${header('Proactive by design','Notification center','Delivery timing and channel preferences are demonstrated locally. This single-file file does not send real email or push notifications.')}<div class="sidebyside spaced"><div class="panel"><h2>Your delivery preferences</h2><label>Discovery frequency<select class="field" onchange="S.frequency=this.value;persist();render()">${[['off','Off'],['daily','Daily'],['weekly','Weekly'],['contextual','Context only'],['both','Daily + contextual']].map(([v,t])=>`<option value="${v}" ${S.frequency===v?'selected':''}>${t}</option>`).join('')}</select></label><div style="height:12px"></div><label>Preferred channel<select class="field" onchange="S.channel=this.value;persist();render()">${['Agent','Email preview','Push preview'].map(x=>`<option ${S.channel===x?'selected':''}>${x}</option>`).join('')}</select></label><div style="height:12px"></div><label>Serendipity level<select class="field" onchange="S.discovery=this.value;persist();render()">${[['focused','Focused on my interests'],['balanced','Balanced'],['exploratory','Surprise me sometimes']].map(([v,t])=>`<option value="${v}" ${S.discovery===v?'selected':''}>${t}</option>`).join('')}</select></label><div class="notice spaced"><b>Preview:</b> ${S.frequency==='off'?'No scheduled prompts.':S.frequency==='contextual'?'Prompt only for a strong real-world event.':S.frequency==='weekly'?'One weekly discovery preview.':'Daily discoveries when allowed by preferences.'} Agent triggers can be suppressed for poor relevance or repetition.</div><button class="btn alt" onclick="queueDaily()" ${S.frequency==='off'?'disabled':''}>Preview a scheduled tip</button></div><div class="panel"><h2>Demo notification inbox</h2>${S.notifications.length?S.notifications.slice(0,20).map(n=>`<div class="detail" style="margin-bottom:9px"><span class="badge">${esc(n.channel)}</span><p><b>${esc(n.message)}</b></p><p class="small muted">${new Date(n.at).toLocaleString()} · ${esc(n.agent)}</p><button class="btn alt sm" onclick="nav('tip/${n.tip}')">Open insight</button></div>`).join(''):'<div class="empty">Send a simulated agent insight or preview a scheduled discovery to populate the inbox.</div>'}</div></div>`}
function queueDaily(){let t=dailyTip();S.notifications.unshift({id:'daily-'+Date.now(),tip:t.id,at:Date.now(),message:'Your daily Wellwise discovery',agent:'Wellwise',channel:S.channel});persist();render();toast('Scheduled delivery added to demo inbox')}
function hashSeed(str){let h=2166136261;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),16777619)}return h>>>0}
function synth(){const kinds=['Commerce','Travel','Environment','Routine','Groceries','Activity','Home'];let rows=kinds.map((k,i)=>{let sc=SCENARIOS.filter(s=>s.kind===k),n=125+i*9,success=0;for(let j=0;j<n;j++){let v=hashSeed(k+'|'+j+'|wellwise')%100;success+=v < (k==='Commerce'?63:k==='Travel'?57:k==='Environment'?48:k==='Routine'?45:k==='Groceries'?60:52)?1:0}return {kind:k,count:n,useful:success,pct:Math.round(100*success/n)}});return rows}
function learning(){let rows=synth(),total=rows.reduce((a,b)=>a+b.count,0),useful=rows.reduce((a,b)=>a+b.useful,0);return `${header('Collective intelligence lab','One knowledge system. Many agents.','Demonstrate how anonymized, permissioned feedback could improve discovery rankings across different personal AI ecosystems.')}<div class="notice warning spaced"><b>Synthetic demonstration:</b> Every metric below is deterministic generated data, not real users, observed effectiveness or clinical outcomes. The prototype does not upload or aggregate user behavior across browsers.</div><div class="grid spaced"><div class="card"><div class="eyebrow">Synthetic interactions</div><div class="metric spaced numeric">${total}</div></div><div class="card"><div class="eyebrow">Simulated useful ratings</div><div class="metric spaced numeric">${Math.round(useful/total*100)}%</div></div><div class="card"><div class="eyebrow">Curated tip connections</div><div class="metric spaced numeric">${EDGES.length}</div></div></div><div class="sidebyside spaced"><div class="panel"><h2>Usefulness by contextual trigger</h2><p class="small muted">Illustrative simulated feedback; not a wellness benchmark.</p><div class="bars">${rows.map(r=>`<div class="barrow"><b>${esc(r.kind)}</b><div class="bar"><i style="width:${r.pct}%"></i></div><span class="numeric">${r.pct}%</span></div>`).join('')}</div></div><div class="panel"><h2>Why a shared network matters</h2><p>Multiple agents encounter different events, but Wellwise can maintain one reviewable corpus, one relationship graph and a common opt-in learning layer.</p><div class="detail"><b>Personal context</b> Remains with the agent where possible.</div><div class="detail spaced"><b>Collective feedback</b> Could help tune relevance once consent and real data infrastructure exist.</div><div class="detail spaced"><b>Evidence guardrail</b> Popularity never upgrades the quality of clinical evidence.</div></div></div><div class="panel spaced"><h2>Explore an illustrative recommendation change</h2><label class="row"><input type="checkbox" ${S.learning?'checked':''} onchange="S.learning=this.checked;persist();render()"> Apply simulated cross-user feedback to an example ranking</label><div class="grid two spaced">${[['Without aggregate signal','ww-061','ww-062'],['With aggregate signal','ww-062','ww-061']].map((x,i)=>`<div class="detail" style="${(+S.learning===i)?'border:2px solid #277954':''}"><div class="eyebrow">${x[0]}</div><p>1. ${esc(tip(x[1]).title)}</p><p>2. ${esc(tip(x[2]).title)}</p><p class="small muted">${i?'An illustrative feedback signal promotes context-specific cookware guidance.':'An illustrative baseline ordering before engagement feedback.'}</p></div>`).join('')}</div><p class="small muted">This toggle is an explanatory simulation only. Actual agent matching continues to rely on the curated trigger keys, novelty and preferences.</p></div><details class="spaced"><summary>About aggregate learning and privacy</summary><p>In a production service, Wellwise would need explicit permissions, aggregation thresholds, privacy governance and a clear separation of behavioral metrics from health-record data. Nothing here represents external agent access.</p></details>`}
function you(){return `${header('Voluntary personalization','Make Wellwise yours.','Choose what you want to discover. You can use the app without sharing a health profile.')}<div class="panel spaced"><h2>Location and interests</h2><label>Primary geography<select class="field" id="geo">${Object.entries(REGIONS).map(([v,n])=>`<option value="${v}" ${S.geo===v?'selected':''}>${n}</option>`).join('')}</select></label><h3 class="spaced">Categories you care about</h3><p class="small muted">Select none to include all.</p><div class="checks">${CATS.map(c=>`<label class="check"><input type="checkbox" class="catcheck" value="${esc(c)}" ${S.cats.includes(c)?'checked':''}> ${esc(c)}</label>`).join('')}</div><h3 class="spaced">Optional profile</h3><div class="formgrid"><label>Age range<select id="age" class="field">${['','Under 18','18–29','30–44','45–59','60+'].map(x=>`<option value="${esc(x)}" ${S.age===x?'selected':''}>${x||'Prefer not to say'}</option>`).join('')}</select></label><label>Diet<select id="diet" class="field">${['','Omnivore','Vegetarian','Vegan','Pescatarian','Other'].map(x=>`<option value="${esc(x)}" ${S.diet===x?'selected':''}>${x||'No preference'}</option>`).join('')}</select></label></div><div class="row spaced"><button class="btn" onclick="savePrefs()">Save preferences</button><button class="btn ghost" onclick="clearPrefs()">Clear profile preferences</button></div><p class="small muted">Geography and categories filter discovery. Age and diet are stored for future tailoring but do not perform clinical personalization in this version.</p></div><div class="panel spaced"><div class="eyebrow">Roadmap · not connected</div><h2>Health context</h2><p>Conditions, medications, allergies, contraindication-based filtering and optional medical document uploads require a governed medical data workflow and are intentionally not active here.</p><div class="formgrid"><label>Health conditions<input disabled class="field" placeholder="Coming later"></label><label>Medications<input disabled class="field" placeholder="Coming later"></label></div><button disabled class="btn ghost spaced">Upload health documents · Coming later</button></div><div class="notice spaced"><b>Local-only prototype:</b> Preferences, events and journey entries stay in this browser. No remote backend, email service, personal agent or analytics collector is active.</div><div class="row spaced"><button class="btn ghost sm" onclick="exportData()">Export my demo data</button><button class="btn ghost sm" onclick="resetAll()">Reset demo data</button></div>`}
function savePrefs(){S.geo=$('geo').value;S.cats=[...document.querySelectorAll('.catcheck:checked')].map(x=>x.value);S.age=$('age').value;S.diet=$('diet').value;persist();nav('discover');toast('Preferences saved')}
function clearPrefs(){S.geo='GLOBAL';S.cats=[];S.age='';S.diet='';persist();render();toast('Profile preferences cleared')}
function exportData(){const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),version:2,state:S},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wellwise-v2-demo-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function resetAll(){if(confirm('Reset all Wellwise V2 preferences, discoveries and demo events stored in this browser?')){localStorage.removeItem(KEY);location.reload()}}
async function shareTip(id){const t=tip(id),url=location.href.split('#')[0]+'#tip/'+id;try{if(navigator.share){await navigator.share({title:'Wellwise: '+t.title,text:t.title+' — '+t.action,url});return}}catch(e){if(e.name==='AbortError')return}try{await navigator.clipboard.writeText(url);toast('Tip link copied; public hosting required to share')}catch(e){window.prompt('Copy this link. It works for others only after the file is hosted publicly:',url)}}
function render(){let path=currentPath(),page=path.startsWith('tip/')?'tip':path;if(!['discover','agent','journey','explore','notifications','learning','you','tip'].includes(page))page='discover';document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let content=page==='tip'?(tip(path.slice(4))?tipPage(tip(path.slice(4))):'<div class="empty">Tip not found.</div>'):{discover,agent,journey,explore,notifications,learning,you}[page]();$('main').innerHTML=content}
window.addEventListener('hashchange',render);document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));render();
</script></body></html>
