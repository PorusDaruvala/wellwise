<style>

.ico{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:1px solid var(--line);border-radius:7px;background:#fff;vertical-align:middle;margin:0 2px;color:#0a64d6}.ico svg{width:17px;height:17px}

 .tabbar button{flex:1;background:none;border:0;padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;font-weight:700;border-radius:10px}
 .tabbar button svg{width:22px;height:22px}.tabbar button.active{color:var(--green)}.tabbar button.active svg{stroke-width:2.4}
 main{padding-bottom:40px}.footer{padding-bottom:calc(90px + env(safe-area-inset-bottom))}.toast{bottom:calc(78px + env(safe-area-inset-bottom))}}
@media(max-width:540px){.wrap{padding:0 16px}.grid,.two,.four,.five,.detailgrid,.formgrid,.checks{grid-template-columns:1fr}.tapgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:19px}.card,.panel{padding:17px}}

<script>
/* ---------- content: data, never code ---------- */
const ENGINE=window.WWEngine;
let CONTENT=WW,TIPS,ALLTIPS,EDGES,MOMENTS,PRODUCTS,CATEGORIES,TIPMAP,CATS,KNOW,ALL_EVENTS,REACHABLE;
function applyContent(c){
 CATEGORIES=c.CATEGORIES;MOMENTS=c.MOMENTS;PRODUCTS=c.PRODUCTS;
 ALLTIPS=c.TIPS.filter(t=>t.status!=='draft');
 TIPMAP=Object.fromEntries(ALLTIPS.map(t=>[t.id,t]));
 TIPS=ALLTIPS.filter(t=>t.status!=='retired');
 const live=new Set(TIPS.map(t=>t.id));
 EDGES=c.EDGES.filter(e=>live.has(e.a)&&live.has(e.b));
 CATS=CATEGORIES.map(x=>x.name).filter(n=>TIPS.some(t=>t.category===n));
 KNOW=Object.fromEntries(CATEGORIES.map(x=>[x.name,x.know]));
 ALL_EVENTS=ENGINE.allEvents(c);
 REACHABLE=TIPS.filter(t=>t.triggerKeys.some(k=>ALL_EVENTS.has(k))).length;
}
applyContent(CONTENT);
const knowPhrase=(c,n)=>(KNOW[c]||['tip about '+c.toLowerCase(),'tips about '+c.toLowerCase()])[n===1?0:1];
const isNew=t=>t.added&&(Date.now()+(S?.offsetDays||0)*864e5-Date.parse(t.added))/864e5<=30;
const REGIONS={GLOBAL:'Worldwide',US:'United States',IN:'India',GB:'United Kingdom',OTHER:'Other'};
const KEY='wellwise-v3-prototype',DAY=864e5;
const SRC={environment:'Near you',share:'Share',scan:'Scan',calendar:'Calendar',prompt:'Quick check-in',whatsapp:'WhatsApp',agent:'Your agent',email:'Email'};
const TABS={near:'Near you',share:'Share',scan:'Scan',calendar:'Calendar',prompt:'Quick check-in',whatsapp:'WhatsApp',agent:'Your agent',email:'Email'};
const VIA={environment:'Near you',share:'Share',scan:'Scan',photo:'Photo',document:'Document',calendar:'Calendar',prompt:'Quick check-in',whatsapp:'WhatsApp',agent:'Your agent',email:'Email',daily:'Daily tip',weekly:'Weekly tip',checkin:'Check-in'};
const GRADE_NOTE={'Strong':'Backed by major public-health guidance.','Moderate':'Reasonable evidence; effects vary by person.','Limited':'Plausible but less studied.','Safety practice':'A precaution based on known hazards.'};
const CHANNELS=['In the app','WhatsApp'];
const TAPS=['p-cook','p-ate','p-shop','p-desk','p-sleep','p-low','p-tired','p-drink','p-out','p-screen'];
const DISCLAIMER='Wellwise shares general health information. It is not a substitute for medical advice. Always check with a certified healthcare provider about your own health.';

const I18N={
 en:{discover:'Discover',moments:'Moments',journey:'My journey',journeyTab:'Journey',explore:'Explore',inbox:'Inbox',settings:'Settings',tryThis:'Try this',why:'Why it matters',considerations:'Keep in mind',timeline:'Typical timeline for this kind of change',localNote:'Local note',willTry:'I’ll try this',trying:'✓ Trying',already:'Already doing',adopted:'✓ Habit',notForMe:'Not for me',open:'Read more →',dailyEyebrow:'Your daily insight',heroTitle:'Learn something useful, right when it matters.',heroSub:'Short, sourced tips, sparked by your day.',useful:'Useful',notUseful:'Not useful'},
 hi:{discover:'खोजें',moments:'पल',journey:'मेरी यात्रा',journeyTab:'यात्रा',explore:'लाइब्रेरी',inbox:'इनबॉक्स',settings:'सेटिंग्स',tryThis:'यह आज़माएँ',why:'यह क्यों ज़रूरी है',considerations:'ध्यान रखें',timeline:'नतीजे कब दिख सकते हैं',localNote:'स्थानीय बात',willTry:'आज़माना है',trying:'✓ आज़मा रहे हैं',already:'पहले से कर रहे हैं',adopted:'✓ आदत बन गई',notForMe:'मेरे लिए नहीं',open:'और पढ़ें →',dailyEyebrow:'आज की जानकारी',heroTitle:'सही समय पर, काम की बात जानें।',heroSub:'आपके दिन से जुड़ी छोटी, भरोसेमंद जानकारियाँ।',useful:'काम का',notUseful:'काम का नहीं'}
};

const DEFAULTS={geo:'GLOBAL',geoAuto:true,cats:[],age:'',diet:'',lang:'en',statuses:{},statusAt:{},seen:{},source:{},feedback:{},checkins:{},notifications:[],events:[],delivered:{},channel:CHANNELS[0],frequency:'both',discovery:'balanced',offsetDays:0,momentTab:'near',selected:null,shareText:'',nearConsent:false,live:null,inboxSince:0,lastDaily:'',tap:null,intakes:{},tz:'',inboxSeenAt:0,pushAskedAt:0,updatedAt:0};
let S;try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){S={}}
S={...DEFAULTS,...S};
if(!CHANNELS.includes(S.channel))S.channel=/whatsapp/i.test(S.channel)?'WhatsApp':CHANNELS[0];
if(S.momentTab==='environment')S.momentTab='near';
let searchText='',searchCat='ALL',searchGeo='MINE',searchKind='ALL';
const API={on:false,features:{},linked:{},calendar:null,wa:null,agentKey:null,email:null,busy:false};

const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let syncTimer=null;
const persist=()=>{S.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(API.on){clearTimeout(syncTimer);syncTimer=setTimeout(pushState,800)}};
const now=()=>Date.now()+S.offsetDays*DAY;
const day=()=>Math.floor(now()/DAY);
const L=k=>(I18N[S.lang]&&I18N[S.lang][k])||I18N.en[k]||k;
const tx=(t,f)=>S.lang==='hi'&&t.hi&&t.hi[f]?t.hi[f]:t[f];
const eligible=t=>ENGINE.eligible(t,S);
const inInterests=t=>!S.cats.length||S.cats.includes(t.category);
const stat=id=>S.statuses[id]||'';
const statusLabel=v=>({trying:L('trying'),adopted:L('adopted'),'not-relevant':L('notForMe')}[v]||'');
const hosted=()=>/^https?:/.test(location.protocol);
const fmtDate=ms=>new Date(ms).toLocaleDateString(undefined,{day:'numeric',month:'short'});
const fmtTime=ms=>new Date(ms).toLocaleString(undefined,{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const rel=id=>EDGES.filter(e=>e.a===id||e.b===id).map(e=>({...e,other:e.a===id?e.b:e.a}));
const header=(ey,title,sub='')=>`${ey?`<div class="eyebrow">${esc(ey)}</div>`:''}<h1>${esc(title)}</h1>${sub?`<p class="lead">${esc(sub)}</p>`:''}`;
const hash=ENGINE.hash;
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.remove('hide');clearTimeout(window.__t);window.__t=setTimeout(()=>el.classList.add('hide'),2800)}

/* ---------- server ---------- */
async function api(path,opts={}){
 if(typeof fetch!=='function')throw new Error('offline');
 const r=await fetch(path,{method:opts.method||'GET',headers:opts.body!==undefined?{'content-type':'application/json'}:{},body:opts.body!==undefined?JSON.stringify(opts.body):undefined,credentials:'same-origin'});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Something went wrong');return j}
async function connect(){
 if(!hosted()||typeof fetch!=='function')return;
 try{const me=await api('/api/me');API.on=true;API.features=me.features||{};API.linked=me.linked||{};
  const tz=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(e){return ''}})();
  const remote=me.state||{};if((remote.updatedAt||0)>(S.updatedAt||0)){const keep={momentTab:S.momentTab,selected:S.selected};S={...DEFAULTS,...remote,...keep};delete S._server;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  if(tz&&S.tz!==tz){S.tz=tz;persist()}else pushState();
  await pullInbox();if(S.nearConsent)refreshLive();checkPush();render();
  setInterval(pullInbox,60e3);window.addEventListener('focus',pullInbox);
 }catch(e){API.on=false}}
/* ---------- notifications: allowed once, then tips arrive by themselves ---------- */
const PUSH_OK=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=()=>(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;render()});
function b64ToU8(s){const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
const u8ToB64=u=>btoa(String.fromCharCode(...new Uint8Array(u))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
/* Each time Wellwise opens, this device re-registers for notifications. If the server's key changed, it signs up again with the new one. No prompt: permission was already given. */
async function checkPush(){
 if(!API.on||!PUSH_OK())return;
 try{const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
  if(sub&&Notification.permission==='granted'){const {key}=await api('/api/push');const used=sub.options?.applicationServerKey;

async function shrinkImage(f){

 const bmp=await createImageBitmap(f),k=Math.min(1,1600/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);

function zxingRead(Z,source){
 const w=source.videoWidth||source.naturalWidth||source.width,h=source.videoHeight||source.naturalHeight||source.height;if(!w||!h)return null;
 const k=Math.min(1,1280/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(source,0,0,c.width,c.height);

 try{return r.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c)))).getText()}catch(e){return null}}

/* ---------- journey helpers ---------- */
function dueCheckins(){const out=[];for(const [id,st] of Object.entries(S.statuses)){if(st!=='trying'||!S.statusAt[id])continue;const age=(now()-S.statusAt[id])/DAY;if(age>=30&&!S.checkins[id+':30'])out.push({id,stage:30});else if(age>=7&&!S.checkins[id+':7'])out.push({id,stage:7})}return out}
function checkin(id,stage,answer){S.checkins[id+':'+stage]=now();if(answer==='kept'){S.statuses[id]='adopted';S.statusAt[id]=now()}else if(answer==='stopped'){delete S.statuses[id];delete S.statusAt[id]}persist();render();toast(answer==='kept'?'Great. It is a habit now.':answer==='stopped'?'No problem. You can come back to it any time.':'Good. We will check in again later.')}
function recap(){const since=now()-7*DAY;return{moments:S.events.filter(e=>e.at>=since).length,discovered:Object.values(S.seen).filter(x=>x>=since).length,trying:Object.entries(S.statusAt).filter(([id,at])=>at>=since&&S.statuses[id]==='trying').length,adopted:Object.entries(S.statusAt).filter(([id,at])=>at>=since&&S.statuses[id]==='adopted').length}}
function knowledge(){const c={};for(const id in S.seen){const t=TIPMAP[id];if(t)c[t.category]=(c[t.category]||0)+1}return Object.entries(c).sort((a,b)=>b[1]-a[1])}
function knowList(){const k=knowledge();return k.length?`<ul class="know">${k.map(([c,n])=>`<li>You now know <b>${n}</b> ${esc(knowPhrase(c,n))}.</li>`).join('')}</ul>`:'<p class="muted small">Open a few tips and this fills in.</p>'}
function recapBlock(){const r=recap();return `<div class="grid four">${[['Moments',r.moments],['New tips',r.discovered],['Started trying',r.trying],['New habits',r.adopted]].map(([l,n])=>`<div class="detail"><span class="small muted">${l}</span><div class="metric numeric" style="font-size:24px;margin-top:4px">${n}</div></div>`).join('')}</div>`}

/* ---------- shared pieces ---------- */
function knownBadge(t){return t.familiarity==='common'?'<span class="badge known" title="Common knowledge, but worth repeating">Well known</span>':'<span class="badge rare" title="Fewer people know this">Lesser known</span>'}
function card(t){return `<article class="card tipcard"><div class="eyebrow">${esc(t.category)}</div><h3>${esc(tx(t,'title'))}</h3><p>${esc(tx(t,'action'))}</p><div class="taglist">${isNew(t)?'<span class="badge new">New</span>':''}${knownBadge(t)}${stat(t.id)?`<span class="badge">${esc(statusLabel(stat(t.id)))}</span>`:''}${S.seen[t.id]?'<span class="badge">Seen</span>':''}</div><div class="row"><button class="btn alt sm" onclick="nav('tip/${t.id}')">${esc(L('open'))}</button><button class="btn ghost sm" onclick="shareTip('${t.id}')">${hosted()?'Share':'Copy tip'}</button></div></article>`}
function tipBlock(t,saveCall,done){return `<div class="card"><h3>${esc(tx(t,'title'))}</h3><p class="small">${esc(tx(t,'why'))}</p><p class="small"><b>${esc(L('tryThis'))}:</b> ${esc(tx(t,'action'))}</p><div class="taglist">${knownBadge(t)}<span class="badge">${esc(t.grade)} evidence</span></div><div class="row spaced">${saveCall?`<button class="btn sm" ${done?'disabled':''} onclick="${saveCall}">${done?'✓ Saved':'Save to my journey'}</button>`:''}<button class="btn ghost sm" onclick="nav('tip/${t.id}')">${esc(L('open'))}</button></div></div>`}
async function shareTip(id){const t=TIPMAP[id];const text=`${t.title} — ${t.action}`;const url=location.href.split('#')[0]+'#tip/'+id;
 try{if(navigator.share&&hosted()){await navigator.share({title:'Wellwise: '+t.title,text,url});return}}catch(e){if(e.name==='AbortError')return}
 const payload=hosted()?text+'\n'+url:text;
 try{await navigator.clipboard.writeText(payload);toast(hosted()?'Link copied':'Tip text copied')}catch(e){window.prompt('Copy this tip:',payload)}}

/* ---------- pages ---------- */
function dailyTip(){return ENGINE.dailyTip(TIPS,S,now())}

function discover(){
 const due=dueCheckins(),lm=liveMoments()[0];
 const fresh=TIPS.filter(x=>eligible(x)&&inInterests(x)&&!S.seen[x.id]&&!isNew(x)).sort((a,b)=>(a.familiarity==='common')-(b.familiarity==='common'));
 let hero;
 if(lm){const top=candidates(lm.m.event).scored[0].t,done=S.delivered['live:'+lm.id+':'+day()];
  hero=`<div class="hero live spaced"><div class="eyebrow">Near you today${S.live.place?' · '+esc(S.live.place):''}</div><h2 style="font-size:29px;margin-top:12px">${esc(lm.m.name)}</h2>${readingBadges(S.live.reading)}<p class="lead">${esc(lm.m.friendly)}</p><h3>${esc(tx(top,'title'))}</h3><p><b>${esc(L('tryThis'))}:</b> ${esc(tx(top,'action'))}</p><div class="row spaced"><button class="btn" onclick="nav('tip/${top.id}')">${esc(L('open'))}</button><button class="btn ghost" ${done?'disabled':''} onclick="saveLive()">${done?'✓ Saved':'Save to my journey'}</button></div><p class="small muted spaced" style="margin-bottom:0">Live from Open-Meteo for your area. Updated ${fmtTime(S.live.at)}.</p></div>`}
 else{const t=dailyTip();
  hero=`<div class="hero spaced"><div class="eyebrow">${esc(L('dailyEyebrow'))} · ${new Date(now()).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</div><h2 style="font-size:29px;margin-top:12px">${esc(tx(t,'title'))}</h2><p class="lead">${esc(tx(t,'why'))}</p><p><b>${esc(L('tryThis'))}:</b> ${esc(tx(t,'action'))}</p><div class="row spaced"><button class="btn" onclick="nav('tip/${t.id}')">${esc(L('open'))}</button><button class="btn ghost" onclick="nav('moments')">Tell us about your day</button></div>
  ${S.live?`<p class="small muted spaced" style="margin-bottom:0">Nothing stands out in the air or weather${S.live.place?' near '+esc(S.live.place):''} today, so here is your daily tip.</p>`:API.on?`<p class="small spaced" style="margin-bottom:0"><a href="#" onclick="useLocation();return false">Turn on Near you</a> <span class="muted">to get tips for today’s air and weather where you are.</span></p>`:''}</div>`}
 const tm=S.tap&&MOMENTS.find(x=>x.id===S.tap),ttop=tm&&candidates(tm.event).scored[0];
 return `${header('',L('heroTitle'),L('heroSub'))}
 ${due.length?`<div class="sectiontitle"><h2>Quick check-in</h2></div><div class="grid two">${due.slice(0,4).map(d=>{const x=TIPMAP[d.id];return `<div class="card checkin"><span class="small muted">${d.stage} days ago you started</span><h3 style="margin-top:6px">${esc(tx(x,'title'))}</h3><p class="small">How is it going?</p><div class="row"><button class="btn sm" onclick="checkin('${d.id}',${d.stage},'kept')">It’s a habit now</button><button class="btn alt sm" onclick="checkin('${d.id}',${d.stage},'still')">Still trying</button><button class="btn ghost sm" onclick="checkin('${d.id}',${d.stage},'stopped')">I stopped</button></div></div>`}).join('')}</div>`:''}
 ${notifyCard()}
 ${hero}
 <div class="panel spaced"><span class="badge">What happened today?</span><h3 style="margin-top:12px">One tap, one more useful tip</h3><div class="tapgrid">${TAPS.map(id=>{const m=MOMENTS.find(x=>x.id===id);return m?`<button class="btn ${S.tap===id?'':'ghost'} sm" onclick="tapMoment('${id}')">${esc(m.name)}</button>`:''}).join('')}</div>
 ${ttop?`<div class="spaced">${tm.id==='p-low'?supportNotice():''}<p class="small muted" style="margin:0 0 8px">${esc(tm.friendly)}</p>${tipBlock(ttop.t,'saveTap()',S.delivered['tap:'+tm.id+':'+day()])}</div>`:''}</div>
 <div class="sectiontitle"><h2>Your week</h2><button class="btn ghost sm" onclick="nav('journey')">My journey →</button></div>
 <div class="panel">${recapBlock()}<div class="spaced">${knowList()}</div></div>
 ${TIPS.some(isNew)?`<div class="sectiontitle"><h2>New in Wellwise</h2><span class="small muted">${TIPS.filter(isNew).length} new tip${TIPS.filter(isNew).length>1?'s':''} this month</span></div><div class="grid">${TIPS.filter(isNew).sort((a,b)=>b.added.localeCompare(a.added)).slice(0,3).map(card).join('')}</div>`:''}
 <div class="sectiontitle"><h2>Keep exploring</h2><button class="btn ghost sm" onclick="nav('explore')">Full library →</button></div>
 <div class="grid">${(fresh.length?fresh:TIPS.filter(eligible)).slice(0,6).map(card).join('')}</div>`;
}
const supportNotice=()=>`<div class="notice danger" style="margin-bottom:12px"><b>If you feel unsafe or in crisis, contact local emergency services or a crisis line now.</b> You do not have to handle it alone.</div>`;
const needsServer=what=>`<div class="empty"><b>${esc(what)} works when Wellwise is online.</b><p class="small">Open Wellwise from its web address to use it.</p></div>`;

 const tab=S.momentTab,selKey=JSON.stringify(S.selected||{});

   <p class="small muted spaced">Wellwise reads event titles, places and times, and sends a tip the day before an event that fits.</p><div class="row"><button class="btn ghost sm" onclick="syncCalendar()">Check now</button><button class="btn ghost sm" onclick="disconnectCalendar()">Disconnect</button></div>`

   <label>Your calendar’s secret address (.ics)<input id="calUrl" class="field" placeholder="https://calendar.google.com/calendar/ical/…/basic.ics"></label><div class="row spaced"><button class="btn" ${API.busy?'disabled':''} onclick="connectCalendar()">${API.busy?'Connecting…':'Connect calendar'}</button><label class="btn ghost sm" style="margin:0">Or add an .ics file<input type="file" accept=".ics,text/calendar" style="display:none" onchange="readFile(this,'document')"></label></div>
   <details class="spaced"><summary>Where to find the address</summary><p class="small"><b>Google Calendar:</b> Settings → your calendar → Integrate calendar → Secret address in iCal format.</p><p class="small"><b>Outlook:</b> Settings → Calendar → Shared calendars → Publish a calendar → ICS link.</p><p class="small"><b>Apple iCloud:</b> Calendar app → share the calendar → Public Calendar → copy the link.</p></details>`}
 }else if(tab==='prompt'){
  body=`<div class="grid two">${MOMENTS.filter(m=>m.source==='prompt').map(m=>pickBtn('moment',m.id,m.name)).join('')}</div>`;
 }else if(tab==='share'){
  body=`<label>Paste a product link, an order confirmation or a few words<textarea id="shareBox" class="field" placeholder="For example: https://www.amazon.in/… or: Order confirmed – 1 × nonstick tawa 28 cm">${esc(S.shareText)}</textarea></label><div class="row spaced"><button class="btn" ${API.busy?'disabled':''} onclick="findShared()">${API.busy?'Reading…':'Find an insight'}</button></div>
  ${API.on?`<div class="drop spaced"><b>Or add a photo or document</b><p class="small muted">A product, a label, a receipt, a prescription, a lab report or a booking.</p><div class="row" style="justify-content:center"><label class="btn alt sm" style="margin:0">Choose a photo<input type="file" accept="image/*" style="display:none" onchange="readFile(this,'photo')"></label><label class="btn alt sm" style="margin:0">Choose a document<input type="file" accept=".pdf,.txt,.eml,.html,.ics,application/pdf,text/*" style="display:none" onchange="readFile(this,'document')"></label></div></div>
  <p class="small muted spaced">On your phone, add Wellwise to your home screen. Then pick Wellwise in the share menu of any shopping app, browser or gallery.</p>`:''}`;

   :`<p>Scan a barcode or a label while you shop. Wellwise looks up the product and brings a tip if one fits.</p><div class="row"><button class="btn" onclick="startCamera()">Open camera</button><label class="btn alt" style="margin:0">Take or choose a photo<input type="file" accept="image/*" capture="environment" style="display:none" onchange="readFile(this,'scan')"></label></div>`;
 }else if(tab==='whatsapp'){

  else if(API.linked.whatsapp)body=`<div class="row between"><span class="badge live">Linked · ${esc(API.linked.whatsapp)}</span><button class="btn ghost sm" onclick="unlinkWhatsApp()">Unlink</button></div><p class="spaced">Send Wellwise a product link, a photo of a label or barcode, an order confirmation, a lab report or a few words about your day. You get one useful tip back, and it joins your journey here.</p><label class="check" style="max-width:420px"><input type="checkbox" ${S.channel==='WhatsApp'?'checked':''} onchange="S.channel=this.checked?'WhatsApp':'In the app';persist();render()"> Also send my tips to WhatsApp</label>`;
  else if(!API.features.whatsapp)body=`<div class="empty"><b>WhatsApp is not available yet.</b><p class="small">It will appear here as soon as it is ready.</p></div>`;
  else body=`<p>Link WhatsApp once. Then forward Wellwise anything: links, photos, order confirmations, bookings or a few words. Tips come back in the chat and join your journey here.</p>${API.wa?`<div class="notice"><p style="margin-top:0">Send this message to <b>${esc(API.wa.number||'Wellwise')}</b> on WhatsApp:</p><p class="metric numeric">LINK ${esc(API.wa.code)}</p><p class="small muted">The code works for 15 minutes.</p>${API.wa.link?`<a class="btn" href="${esc(API.wa.link)}" target="_blank" rel="noopener">Open WhatsApp</a>`:''}<button class="btn ghost sm" style="margin-left:6px" onclick="refreshMe().then(render)">I’ve sent it</button></div>`:`<button class="btn" onclick="linkWhatsApp()">Link WhatsApp</button>`}`;
 }else if(tab==='agent'){
  if(!API.on)body=`<div class="empty"><b>Link your AI agent</b><p>If you use a personal AI agent for shopping, travel or your calendar, it can send moments to Wellwise once Wellwise is online.</p></div>`;
  else{const k=API.agentKey,ag=API.agents,mcp=ag?.mcp||location.origin+'/mcp';body=`<p>Link your AI agent. If it shops, books or plans for you, it can tell Wellwise what happened. Wellwise picks a tip that fits and saves it to your journey, whichever agent sent it.</p>
   <h3 class="spaced">Connect your agent</h3>
   <p class="small">Choose the one you use. Each needs only this once.</p>
   ${agentOptions(mcp)}
   ${ag?.connected?.length?`<div class="spaced">${ag.connected.map(c=>`<div class="status"><span><b>${esc(c.name)}</b><br><span class="small muted">Connected ${fmtDate(c.since)}</span></span><button class="btn ghost sm" onclick="disconnectAgent('${esc(c.id)}')">Disconnect</button></div>`).join('')}</div>`:''}
   <h3 class="spaced">Or use a key</h3><p class="small muted">For agents you build or run yourself.</p>
   ${k?`<div class="notice"><b>Your agent key</b><p class="small">Copy it now. It is shown only once.</p><p><code>${esc(k.key)}</code> <button class="btn ghost sm" onclick="copyText('${esc(k.key)}')">Copy</button></p><p class="small"><b>MCP server:</b> <code>${esc(k.mcp)}</code></p><p class="small"><b>REST:</b> <code>POST ${esc(k.api)}/moments</code></p><pre>curl -X POST ${esc(k.api)}/moments \\
  -H "Authorization: Bearer ${esc(k.key)}" -H "Content-Type: application/json" \\

 }else if(tab==='email'){

   :`<p>Get your own Wellwise address. Forward order confirmations, bookings or results to it, and get a tip that fits.</p><button class="btn" onclick="makeEmail()">Get my address</button>`;

 const tabs=Object.entries(TABS).filter(([k])=>k!=='email'||API.features.email);
 return `<div class="panel"><h2>1. What’s happening?</h2><div class="tabs" role="tablist">${tabs.map(([k,v])=>`<button role="tab" aria-selected="${tab===k}" class="tab ${tab===k?'active':''}" onclick="setTab('${k}')">${v}</button>`).join('')}</div>${body}</div>`;

function intakeSummary(r){if(!r)return '';const bits=[];if(r.product)bits.push(`<p class="small" style="margin:4px 0"><b>${esc([r.product.brand,r.product.name].filter(Boolean).join(' ')||'Product')}</b>${r.product.quantity?' · '+esc(r.product.quantity):''}${r.product.nutriscore?' · Nutri-Score '+esc(String(r.product.nutriscore).toUpperCase()):''}${r.product.nova?' · NOVA '+esc(r.product.nova):''}</p>`);
 if(r.matches?.length)bits.push(`<div class="taglist" style="margin:6px 0">${r.matches.slice(0,4).map(m=>`<span class="badge">${esc(m.label)}</span>`).join('')}</div>`);
 if(r.read?.length)bits.push(`<p class="small muted" style="margin:4px 0">Read with ${esc(r.read.join(', '))}</p>`);
 if(r.note)bits.push(`<p class="small muted" style="margin:4px 0">${esc(r.note)}</p>`);return bits.join('')}
function momentPreview(){
 const m=resolveSel(S.selected);
 if(!m)return `<div class="panel"><h2>2. What Wellwise shows</h2><div class="empty">${API.busy?'Reading…':'Share something, scan a product, connect your calendar or tap a moment.'}</div></div>`;
 const {scored}=candidates(m.event),done=S.delivered[m.key],top=done?TIPMAP[done]:(m.intake&&m.intake.tip&&TIPMAP[m.intake.tip])||scored[0]?.t;
 const from=VIA[m.source]||SRC[m.source]||'Wellwise';
 return `<div class="panel"><h2>2. What Wellwise shows</h2><div class="bubble"><div class="eyebrow">${esc(from)}</div><p class="small muted" style="margin-bottom:6px">${esc(m.name)}</p>${intakeSummary(m.intake)}
 ${m.support?supportNotice():''}
 ${top?`<p style="margin-top:10px">${esc(m.friendly)}</p>${tipBlock(top,'deliver()',done)}`
 :`<div class="notice warn" style="margin-top:10px"><b>No strong match.</b><p class="small" style="margin:4px 0 0">Wellwise will not invent a health link for this.</p></div>`}
 </div><details class="spaced"><summary>How we chose this</summary><p class="small muted">This tip fits what is happening. We also look at your region, topics, diet, feedback and what you have seen before.</p>${scored.slice(0,5).map((x,i)=>`<div class="scorerow"><span class="small">${i+1}. ${esc(x.t.title)}<br><span class="muted">${esc(x.why.join(' · ')||'base match')}</span></span></div>`).join('')||'<p class="muted small">No candidates.</p>'}</details></div>`;
}
function moments(){
 const agentEvents=S.events.filter(e=>e.source==='agent');
 return `${header('','Tell Wellwise about your day.','Live conditions near you, a link or photo you share, a barcode, your calendar, WhatsApp or your AI agent. Each one can bring a tip that fits.')}
 <div class="side spaced">${momentPicker()}${momentPreview()}</div>
 ${agentEvents.length?`<div class="sectiontitle"><h2>One journey across agents</h2></div><div class="panel"><div class="timeline">${agentEvents.slice(0,8).map(e=>`<div class="event"><b>${esc(e.agent||'Agent')}</b> <span class="muted small">· ${fmtTime(e.at)}</span><p style="margin:2px 0"><a href="#tip/${e.tip}">${esc(TIPMAP[e.tip]?.title||e.tip)}</a></p><p class="small muted" style="margin:0">${esc(e.moment)}</p></div>`).join('')}</div></div>`:''}`;
}

function journey(){
 const seen=TIPS.filter(t=>S.seen[t.id]),adopted=TIPS.filter(t=>stat(t.id)==='adopted'),trying=TIPS.filter(t=>stat(t.id)==='trying');
 const ids=new Set(seen.map(t=>t.id)),jEdges=EDGES.filter(e=>ids.has(e.a)&&ids.has(e.b)),nearEdges=EDGES.filter(e=>(ids.has(e.a)!==ids.has(e.b)));
 const sources=[...new Set(Object.values(S.source))];
 return `${header('','My journey','What you learned, tried and kept.')}
 <div class="grid spaced">${[['Seen',seen.length,'Tips you opened or received'],['Trying',trying.length,'Actions you chose to try'],['Habits',adopted.length,'Actions that are part of your life']].map(([x,n,d])=>`<div class="card"><div class="eyebrow">${x}</div><div class="metric numeric spaced">${n}</div><p class="small muted">${d}</p></div>`).join('')}</div>
 <div class="side spaced"><div class="panel"><h2>This week</h2>${recapBlock()}<h3 class="spaced">What you now know</h3>${knowList()}</div>
 <div class="panel"><h2>Where your tips came from</h2>${sources.length?`<div class="taglist">${sources.map(s=>`<span class="badge">${esc(s)}</span>`).join('')}</div><p class="small muted spaced">Your journey stays the same whatever brought the tip: Wellwise itself, a moment, WhatsApp or any agent you link.</p>`:'<div class="empty">Nothing yet.</div>'}</div></div>

 <div class="sectiontitle"><h2>Your habits</h2></div><div class="grid">${adopted.length?adopted.map(card).join(''):'<div class="empty">Tips you already do, or have turned into habits, show here.</div>'}</div>`;

function exploreList(){let a=TIPS.filter(inInterests);
 if(searchGeo==='MINE')a=a.filter(eligible);else if(searchGeo==='LOCAL')a=a.filter(t=>t.scope!=='GLOBAL'&&eligible(t));else if(searchGeo!=='ALL')a=a.filter(t=>t.regions.includes(searchGeo));
 if(searchCat!=='ALL')a=a.filter(t=>t.category===searchCat);
 if(searchKind==='NEW')a=a.filter(isNew);else if(searchKind==='RARE')a=a.filter(t=>t.familiarity!=='common');else if(searchKind==='COMMON')a=a.filter(t=>t.familiarity==='common');
 if(searchText){const q=searchText.toLowerCase();a=a.filter(t=>[t.title,t.action,t.why,t.category,...t.tags,...(t.hi?Object.values(t.hi):[])].join(' ').toLowerCase().includes(q))}return a}
const exploreCount=a=>`Showing ${a.length} of ${TIPS.length} tips · ${searchGeo==='MINE'?'for '+REGIONS[S.geo]:searchGeo==='ALL'?'all regions':searchGeo==='LOCAL'?'specific to '+REGIONS[S.geo]:'for '+REGIONS[searchGeo]}${S.cats.length?' · filtered by your interests':''}`;
function explore(){const a=exploreList();return `${header('','Explore every tip.','Search by topic, product or situation.')}
 <div class="panel spaced"><div class="grid five"><input class="field" id="search" placeholder="Search tips…" aria-label="Search tips" value="${esc(searchText)}" oninput="searchText=this.value;updateExplore()">
 <select class="field" aria-label="Category" onchange="searchCat=this.value;updateExplore()"><option value="ALL">All categories</option>${CATS.map(c=>`<option ${searchCat===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
 <select class="field" aria-label="Region" onchange="searchGeo=this.value;updateExplore()"><option value="MINE" ${searchGeo==='MINE'?'selected':''}>My region: ${esc(REGIONS[S.geo])}</option><option value="LOCAL" ${searchGeo==='LOCAL'?'selected':''}>Only tips specific to my region</option><option value="ALL" ${searchGeo==='ALL'?'selected':''}>All regions</option>${['IN','GB','US'].map(r=>`<option value="${r}" ${searchGeo===r?'selected':''}>${REGIONS[r]}</option>`).join('')}</select>
 <select class="field" aria-label="Kind of tip" onchange="searchKind=this.value;updateExplore()"><option value="ALL">All tips</option><option value="RARE" ${searchKind==='RARE'?'selected':''}>Lesser known</option><option value="COMMON" ${searchKind==='COMMON'?'selected':''}>Well known</option><option value="NEW" ${searchKind==='NEW'?'selected':''}>New this month</option></select>
 <button class="btn ghost" onclick="searchText='';searchCat='ALL';searchGeo='MINE';searchKind='ALL';render()">Clear</button></div><p class="small muted" id="exploreCount">${esc(exploreCount(a))}</p></div>
 <div class="grid spaced" id="exploreResults">${a.length?a.map(card).join(''):'<div class="empty">No tips match. Try a broader search.</div>'}</div>`}
function updateExplore(){const a=exploreList();$('exploreResults').innerHTML=a.length?a.map(card).join(''):'<div class="empty">No tips match. Try a broader search.</div>';$('exploreCount').textContent=exploreCount(a)}

function notifCard(n){const t=TIPMAP[n.tip];if(!t)return '';const from=n.agent||VIA[n.source]||'Wellwise';
 if(n.channel==='WhatsApp')return `<div style="margin-bottom:12px"><div class="wa"><b>Wellwise</b><p style="margin:4px 0">${esc(n.message)}</p><p style="margin:4px 0"><b>${esc(tx(t,'title'))}</b><br>${esc(tx(t,'action'))}</p><p class="small" style="margin:4px 0"><a href="#tip/${t.id}">Read more on Wellwise</a></p><div class="meta">${fmtTime(n.at)} ✓✓</div></div><p class="small muted" style="margin:4px 0 0">Sent to WhatsApp · via ${esc(from)}</p></div>`;
 return `<div class="detail" style="margin-bottom:10px"><span class="badge">${esc(from)}</span><p style="margin:8px 0 2px"><b>${esc(tx(t,'title'))}</b></p><p class="small" style="margin:0 0 6px">${esc(n.message)}</p><p class="small muted">${fmtTime(n.at)} · ${esc(n.moment||'')}</p><button class="btn alt sm" onclick="nav('tip/${t.id}')">Open tip</button></div>`}
function inbox(){
 return `${header('','Your tips, delivered your way.','Choose when and where tips reach you.')}
 <div class="side spaced"><div class="panel"><h2>Delivery</h2>
 <label>How often<select class="field" onchange="S.frequency=this.value;persist();render()">${[['off','Off'],['daily','Daily tip only'],['weekly','Weekly tip only'],['contextual','Moments only'],['both','Daily tip and moments']].map(([v,t])=>`<option value="${v}" ${S.frequency===v?'selected':''}>${t}</option>`).join('')}</select></label><div class="gap"></div>
 <label>Where<select class="field" onchange="S.channel=this.value;persist();render()"><option ${S.channel==='In the app'?'selected':''}>In the app</option><option ${S.channel==='WhatsApp'?'selected':''} ${API.linked.whatsapp?'':'disabled'}>WhatsApp${API.linked.whatsapp?'':' (link it in Moments first)'}</option></select></label><div class="gap"></div>
 <label>Surprise level<select class="field" onchange="S.discovery=this.value;persist();render()">${[['focused','Stick to my interests'],['balanced','Balanced'],['exploratory','Surprise me sometimes']].map(([v,t])=>`<option value="${v}" ${S.discovery===v?'selected':''}>${t}</option>`).join('')}</select></label>
 <div class="notice spaced small">${S.frequency==='off'?'No tips will be sent.':S.frequency==='contextual'?'Tips arrive only when a moment fits: your calendar, the air and weather near you, WhatsApp or your agent.':S.frequency==='weekly'?'One tip each Monday.':S.frequency==='daily'?'One tip each morning.':'One tip each morning, plus tips when a moment fits.'} The surprise level changes which tip a moment brings.</div></div>
 <div class="panel"><h2>Inbox</h2>${S.notifications.length?S.notifications.slice(0,25).map(notifCard).join(''):'<div class="empty">Tips you save, and tips Wellwise sends you, show here.</div>'}</div></div>`}
/* Without the server, the daily tip still lands in the inbox once a day. */
function localDaily(){if(API.on||!['daily','both'].includes(S.frequency))return;const d=new Date(now()).toISOString().slice(0,10);if(S.lastDaily===d)return;const t=dailyTip();S.lastDaily=d;S.notifications.unshift({id:'day-'+d,tip:t.id,at:now(),message:'Your Wellwise tip for today',source:'daily',agent:null,channel:'In the app',moment:'Your daily tip'});S.notifications=S.notifications.slice(0,100);persist()}

 <h3 class="spaced">About you</h3><div class="formgrid"><label>Age range<select id="age" class="field">${['','Under 18','18–29','30–44','45–59','60+'].map(x=>`<option value="${esc(x)}" ${S.age===x?'selected':''}>${x||'Prefer not to say'}</option>`).join('')}</select></label><label>Diet<select id="diet" class="field">${['','Omnivore','Vegetarian','Vegan','Pescatarian','Other'].map(x=>`<option value="${esc(x)}" ${S.diet===x?'selected':''}>${x||'Prefer not to say'}</option>`).join('')}</select></label></div><p class="small muted">Diet changes which tips rise first. For example, “Vegan” brings B12 and fortified-food tips forward.</p>
 <div class="row spaced"><button class="btn" onclick="savePrefs()">Save</button><button class="btn ghost" onclick="clearPrefs()">Clear</button></div></div>
 <div class="panel spaced"><div class="eyebrow">Coming soon</div><h2>Health details</h2><p>Add conditions, medicines and allergies, and Wellwise will bring the tips that matter most to you. This is coming soon.</p><div class="formgrid"><label>Conditions<input disabled class="field" placeholder="Coming later"></label><label>Medicines<input disabled class="field" placeholder="Coming later"></label></div></div>
 ${API.on?`<div class="panel spaced"><h2>Connected</h2><div class="status"><span><b>Notifications on this device</b><br><span class="small muted">${API.pushOn?'On':PUSH_OK()?'Off':isIOS()&&!standalone()?'Add Wellwise to your Home Screen first':'Not available in this browser'}</span>${!API.pushOn&&isIOS()&&!standalone()?iosSteps():''}</span>${API.pushOn?`<button class="btn ghost sm" onclick="disablePush()">Turn off</button>`:PUSH_OK()?`<button class="btn ghost sm" onclick="enablePush()">Turn on</button>`:''}</div>${[['Near you',S.nearConsent?'On':'Off','near'],['Calendar',ln.calendar?'Connected':'Not connected','calendar'],['WhatsApp',ln.whatsapp?'Linked · '+ln.whatsapp:'Not linked','whatsapp'],['Your agent',ln.agent?'Key active':'Not linked','agent'],...(API.features.email?[['Email',ln.email||'Not set up','email']]:[])].map(([n,v,tab])=>`<div class="status"><span><b>${n}</b><br><span class="small muted">${esc(v)}</span></span><button class="btn ghost sm" onclick="S.momentTab='${tab}';persist();nav('moments')">Manage</button></div>`).join('')}</div>`:''}
 <div class="panel spaced"><h2>Your data</h2><p class="small muted">${API.on?'Your settings and journey are saved to your Wellwise account on this device, so they survive a cleared browser.':'Your settings and journey are kept in this browser.'}</p>
 <div class="row"><button class="btn ghost sm" onclick="exportData()">Export my data</button>${API.on?'<button class="btn ghost sm" onclick="deviceCode()">Use Wellwise on another device</button>':''}<button class="btn ghost sm" onclick="resetAll()">Delete all my data</button></div>
 ${API.on?`<details class="spaced"><summary>Have a code from another device?</summary><div class="row spaced"><input id="joinCode" class="field" style="max-width:180px" inputmode="numeric" placeholder="6-digit code"><button class="btn alt sm" onclick="joinDevice()">Use this code</button></div></details>`:''}</div>`}
function savePrefs(){const g=$('geo').value;S.geoAuto=g==='AUTO';S.geo=S.geoAuto?(S.live?.region||S.geo):g;S.cats=[...document.querySelectorAll('.catcheck:checked')].map(x=>x.value);S.age=$('age').value;S.diet=$('diet').value;persist();toast('Saved');nav('discover')}
function clearPrefs(){Object.assign(S,{geo:S.live?.region||'GLOBAL',geoAuto:true,cats:[],age:'',diet:''});persist();render();toast('Cleared')}
function exportData(){const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),version:4,state:S},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wellwise-my-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function resetAll(){if(!confirm('Delete all your Wellwise data? This cannot be undone.'))return;if(API.on)await api('/api/me',{method:'DELETE',body:{}}).catch(()=>{});try{localStorage.removeItem(KEY)}catch(e){}location.hash='#discover';location.reload()}
async function deviceCode(){try{const r=await api('/api/device-code',{method:'POST',body:{}});alert(`On your other device, open Wellwise → Settings → Your data, and enter ${r.code}. The code works for 10 minutes.`)}catch(e){toast(e.message)}}
async function joinDevice(){const code=($('joinCode')?.value||'').trim();try{await api('/api/device-join',{method:'POST',body:{code}});S.updatedAt=0;try{localStorage.removeItem(KEY)}catch(e){}location.reload()}catch(e){toast(e.message)}}

function tipPage(t){
 const edges=rel(t.id),note=t.notes?.[S.geo]||'';
 return `<p class="small"><a href="#explore">← Library</a></p>${header(t.category,tx(t,'title'),tx(t,'why'))}
 <div class="taglist spaced">${knownBadge(t)}<span class="badge" title="${esc(GRADE_NOTE[t.grade])}">${esc(t.grade)} evidence</span>${isNew(t)?'<span class="badge new">New</span>':''}<span class="badge">${t.scope==='GLOBAL'?'Applies widely':esc(REGIONS[t.scope])+' only'}</span>${S.source[t.id]?`<span class="badge">Came from: ${esc(S.source[t.id])}</span>`:''}</div>
 <p class="small muted" style="margin-top:10px">${esc(GRADE_NOTE[t.grade])}</p>
 ${t.familiarity==='common'?`<div class="notice spaced"><b>You may know this one already.</b><p class="small" style="margin:4px 0 0">It is common advice, and it is here because it does a lot of good${edges.length?` and connects to ${edges.length} other tip${edges.length>1?'s':''} below. Together they show the bigger picture.`:'.'}</p></div>`:''}
 <div class="detailgrid spaced"><div class="detail"><b>${esc(L('tryThis'))}</b>${esc(tx(t,'action'))}</div><div class="detail"><b>${esc(L('why'))}</b>${esc(tx(t,'why'))}</div><div class="detail"><b>${esc(L('considerations'))}</b>${esc(t.caution)}</div><div class="detail"><b>${esc(L('timeline'))}</b>${esc(t.timeline)}</div>${note?`<div class="detail"><b>${esc(L('localNote'))} · ${esc(REGIONS[S.geo])}</b>${esc(note)}</div>`:''}</div>
 <div class="row spaced"><button class="btn ${stat(t.id)==='trying'?'':'alt'}" onclick="setStatus('${t.id}','trying')">${esc(stat(t.id)==='trying'?L('trying'):L('willTry'))}</button><button class="btn ${stat(t.id)==='adopted'?'':'ghost'}" onclick="setStatus('${t.id}','adopted')">${esc(stat(t.id)==='adopted'?L('adopted'):L('already'))}</button><button class="btn ghost" onclick="setStatus('${t.id}','not-relevant')">${stat(t.id)==='not-relevant'?'✓ ':''}${esc(L('notForMe'))}</button><button class="btn ghost" onclick="shareTip('${t.id}')">${hosted()?'Share ↗':'Copy tip'}</button></div>
 <div class="row" style="margin-top:10px"><span class="small muted">Was this useful?</span><button class="btn sm ${S.feedback[t.id]==='useful'?'':'ghost'}" onclick="vote('${t.id}','useful')">👍 ${esc(L('useful'))}</button><button class="btn sm ${S.feedback[t.id]==='not-useful'?'':'ghost'}" onclick="vote('${t.id}','not-useful')">👎 ${esc(L('notUseful'))}</button></div>
 <div class="panel spaced"><div class="eyebrow">Connections</div><h2>How this tip links to others</h2>${edges.length?`<div class="graphrow"><div class="graphnode center"><b>${esc(tx(t,'title'))}</b><p class="small" style="margin:4px 0 0">This tip</p></div>${edges.slice(0,6).map(e=>`<div class="graphnode"><span class="badge">${esc(e.type)}</span><p style="margin:6px 0"><a href="#tip/${e.other}"><b>${esc(TIPMAP[e.other].title)}</b></a></p><p class="small muted" style="margin:0">${esc(e.why)}</p></div>`).join('')}</div>`:`<div class="empty">No links written for this tip yet.</div>`}</div>
 ${t.sponsor?`<div class="sponsored spaced"><div class="row between"><span class="badge sponsor">Sponsored</span><span class="small muted">Shown because of this tip’s topic, not because of you</span></div><h3 style="margin-top:10px">${esc(t.sponsor.name)}</h3><p class="small"><b>Our sponsor standard:</b> ${esc(t.sponsor.criteria)}</p><p class="small muted" style="margin:0">Sponsors never choose which tip appears or change what it says. They see no personal data.</p></div>`:''}
 <div class="panel spaced"><h3>Sources</h3><p class="small muted">${t.sourceLevel==='tip'?'The first link backs this tip directly. Others cover the wider topic.':'These links cover the wider topic.'}</p><div class="sourcelinks">${t.sources.map((s,i)=>`<a href="${esc(s)}" target="_blank" rel="noopener noreferrer">${i===0&&t.sourceLevel==='tip'?'Tip source':'Topic source'}: ${esc(new URL(s).hostname)} ↗</a>`).join('')}</div></div>`;
}

async function checkForNewContent(){if(!hosted()||typeof fetch!=='function')return;try{const r=await fetch('wellwise-content.json',{cache:'no-cache'});if(!r.ok)return;const c=await r.json();if(c&&Array.isArray(c.TIPS)&&+c.contentVersion>+CONTENT.contentVersion){CONTENT=c;applyContent(c);render();toast('The library has new tips')}}catch(e){}}

const navLabel=k=>k==='journey'?L('journeyTab'):L(k);
const unreadCount=()=>S.notifications.filter(n=>n.at>(S.inboxSeenAt||0)).length;
function currentPath(){return decodeURIComponent(location.hash.slice(1))||'discover'}
function nav(p){if(location.hash==='#'+p){route()}else{location.hash='#'+p}window.scrollTo(0,0)}
async function route(){const p=currentPath();if(p==='inbox'&&unreadCount()){S.inboxSeenAt=Date.now();persist()}if(p.startsWith('tip/')&&TIPMAP[p.slice(4)])markSeen(p.slice(4),'Explore');
 if(camStream&&!(p==='moments'&&S.momentTab==='scan'))stopCamera();
 const im=p.match(/^moments\/intake\/(in-[a-f0-9]+)$/);
 if(im){S.momentTab='share';history.replaceState(null,'','#moments');try{const r=await api('/api/intake/'+im[1]);keepIntake(r,'share')}catch(e){toast('We could not open what you shared')}}
 if(p==='moments'&&S.momentTab==='calendar'&&!API.calendar)loadCalendar();
 if(p==='moments'&&S.momentTab==='agent'&&!API.agents)loadAgents();
 render()}
function render(){
 document.documentElement.lang=S.lang==='hi'?'hi':'en';
 const path=currentPath();let page=path.startsWith('tip/')?'tip':path.startsWith('moments')?'moments':path;
 if(![...PAGES,'tip'].includes(page))page='discover';
 const count=TIPS.filter(eligible).length,unread=unreadCount(),here=k=>page===k?'active':'',cur=k=>page===k?' aria-current="page"':'';
 $('nav').innerHTML=NAV.map(k=>`<button class="navbtn ${here(k)}"${cur(k)} onclick="nav('${k}')">${ICON[k]}${esc(navLabel(k))}${k==='explore'?' · '+count:''}</button>`).join('');
 $('tabbar').innerHTML=NAV.map(k=>`<button class="${here(k)}"${cur(k)} onclick="nav('${k}')">${ICON[k]}<span>${esc(navLabel(k))}</span></button>`).join('');
 $('icons').innerHTML=`<button class="iconbtn ${here('inbox')}"${cur('inbox')} onclick="nav('inbox')" aria-label="${esc(L('inbox'))}${unread?`, ${unread} new`:''}">${ICON.inbox}${unread?`<span class="dot">${Math.min(unread,99)}</span>`:''}</button><button class="iconbtn ${here('settings')}"${cur('settings')} onclick="nav('settings')" aria-label="${esc(L('settings'))}">${ICON.settings}</button>`;
 const t=page==='tip'?TIPMAP[path.slice(4)]:null;
 $('main').innerHTML=page==='tip'?(t?tipPage(t):'<div class="empty">Tip not found.</div>'):{discover,moments,journey,explore,inbox,settings}[page]();
 $('footer').innerHTML=`${esc(DISCLAIMER)}`;
}
